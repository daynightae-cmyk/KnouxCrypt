<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Restrict production renderer scripts and external connections. Inline
         styles are required for current React/CSS transitions; JS eval is not. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws://localhost:3000 ws://127.0.0.1:3000" />
    <!-- Generated by scripts/generate-icons.cjs from the official emblem. This
         used to point at /favicon.ico with an image/svg+xml type while no public
         directory existed, so every browser tab showed the default globe. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icon-128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Standardised brand line. The old title described a whole-disk product,
         which this suite is not: it encrypts files, vaults, notes, credentials
         and keys on the local machine. -->
    <title>KNOUX CRYPT — Private Encryption Suite</title>
    <meta name="description" content="KnouxCrypt — مجموعة التشفير الخاصة: تشفير الملفات والخزنة المحمية والملاحظات وكلمات المرور ورموز التحقق والمفاتيح، كل ذلك محليًا على جهازك دون رفع أي بيانات." />
    <meta property="og:title" content="KNOUX CRYPT — Private Encryption Suite" />
    <meta property="og:description" content="مجموعة التشفير الخاصة: ملفات، خزنة، ملاحظات، كلمات مرور، رموز تحقق ومفاتيح — محليًا على جهازك." />
    <meta name="theme-color" content="#080411" />
    <!-- No third-party font stylesheet. The Inter link here used to be a
         render-blocking request to fonts.googleapis.com, which meant the
         document's `load` event — and therefore the end of the native boot
         view — waited on a CDN: scripts/electron-lifecycle-check.cjs measured
         boot views held for 2 to 24 seconds on the same build, and an offline
         machine was the worst case. It also contradicted this app's own
         connect-src 'self' posture: a local encryption suite should not phone
         home on every launch. The Latin text now uses the same system stack as
         the rest of the shell, and the Arabic faces stay the bundled local
         assets in src/assets/fonts. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
