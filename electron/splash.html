<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnouxCrypt™ 2025 - جاري التحميل</title>
    <!-- The splash is a static document: its own script and stylesheet are external,
         so no inline execution and no network are allowed anywhere in it. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'" />
    <link rel="stylesheet" href="./splash.css" />
  </head>
  <body>
    <!-- خلفية متحركة -->
    <div class="background-animation"></div>

    <!-- تأثير التوهج -->
    <div class="glow"></div>

    <!-- جزيئات متحركة -->
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- الحاوية الرئيسية -->
    <div class="splash-container">
      <div class="logo">
        <div class="logo-icon">🔐</div>
        <div class="logo-text">
          <h1>KnouxCrypt™</h1>
          <div class="version">الإصدار 2025.1.0</div>
          <div class="description">نظام التشفير العسكري المتقدم</div>
        </div>
      </div>

      <div class="loading-section">
        <div class="loading-text" id="loadingText">جاري تحميل النظام...</div>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
      </div>
    </div>

    <!-- معلومات الشركة -->
    <div class="info-section">
      <div class="company">Knoux Technologies</div>
      <div class="copyright">© 2025 جميع الحقوق محفوظة</div>
    </div>

    <script src="./splash.js" defer></script>
  </body>
</html>
