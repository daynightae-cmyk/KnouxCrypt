name: Android Native CI
on:
  pull_request:
    paths: ['native-android/**', '.github/workflows/android.yml']
  push:
    branches: [main, 'production/**']
    paths: ['native-android/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          # android-actions/setup-android@v3 defaults to installing the legacy 'tools'
          # package, which no longer exists and fails the job before any build step.
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
          cache-read-only: true
      - name: Source boundary check
        run: python3 native-android/scripts/check-source.py
      - name: Compile Kotlin
        run: gradle --no-daemon -p native-android :core:security:compileKotlin :core:data:compileDebugKotlin :app:compileDebugKotlin :core:data:compileDebugAndroidTestKotlin --stacktrace
      - name: JVM tests
        run: gradle --no-daemon -p native-android :core:security:test :core:data:testDebugUnitTest :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle --no-daemon -p native-android :app:lintDebug --stacktrace
      - name: Debug APK
        run: gradle --no-daemon -p native-android :app:assembleDebug --stacktrace
      - name: SHA-256
        run: sha256sum native-android/app/build/outputs/apk/debug/*.apk
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-evidence
          if-no-files-found: warn
          path: |
            native-android/core/security/build/test-results/
            native-android/core/data/build/test-results/
            native-android/app/build/test-results/
            native-android/app/build/reports/
            native-android/app/build/outputs/apk/debug/
